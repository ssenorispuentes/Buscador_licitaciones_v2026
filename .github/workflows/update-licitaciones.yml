name: Actualizar licitaciones

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write

jobs:
  scraping:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m spacy download es_core_news_sm
          python -m nltk.downloader stopwords

      - name: Ejecutar scraping
        run: python main_scraping.py --usar_scraping

      - name: Conservar logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-scraping
          path: logs/
          if-no-files-found: warn

      - name: Publicar CSV actualizado
        run: |
          if git diff --quiet -- datos_licitaciones_final/licitaciones.csv; then
            echo "El CSV no ha cambiado"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos_licitaciones_final/licitaciones.csv
          git commit -m "Actualizar licitaciones automáticamente"
          git push
